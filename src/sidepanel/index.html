<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Prompt:wght@200;300;400;500&display=swap"
      rel="stylesheet"
    />
    <title>snCat</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="app-header">
      <img
        class="app-logo"
        src="/public/brand/mfec-logo-dark.png"
        alt="MFEC"
      />
      <span class="app-title">ServiceNow AI Assistant</span>
    </header>

    <main class="app-main">
      <section class="card" id="context-card">
        <h2 class="card-title">Page context</h2>
        <dl class="ctx-grid" id="ctx-grid">
          <dt>Status</dt>
          <dd id="ctx-status">Detecting…</dd>
        </dl>
        <button class="btn" id="refresh-btn" type="button">Refresh</button>
      </section>

      <section class="card" id="condition-card">
        <h2 class="card-title">Condition Tester</h2>
        <p class="hint" id="cond-table-hint">Detect a table first.</p>
        <label class="field-label" for="cond-query">Encoded query</label>
        <textarea
          id="cond-query"
          class="query-input"
          rows="2"
          placeholder="active=true^priority=1  (leave blank to match all)"
        ></textarea>
        <div class="btn-row">
          <button class="btn" id="cond-run" type="button" disabled>Run condition</button>
          <span class="count-badge" id="cond-count" hidden></span>
        </div>
        <div class="results" id="cond-results"></div>
      </section>

      <section class="card muted" id="schema-card">
        <h2 class="card-title">Table schema</h2>
        <div class="btn-row">
          <button class="btn btn-ghost" id="schema-load" type="button" disabled>
            Load fields
          </button>
          <span class="count-badge" id="schema-count" hidden></span>
        </div>
        <div class="results" id="schema-results"></div>
      </section>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
